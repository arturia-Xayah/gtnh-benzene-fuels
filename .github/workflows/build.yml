name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            17
            25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: benzenefuels-0.4.4-alpha-GTNH-2.9.0
          path: build/libs/benzenefuels-0.4.4-alpha.jar
          if-no-files-found: error
