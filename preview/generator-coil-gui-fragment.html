<script>
(()=>{
 const root=document.getElementById('bf-compact-gui'),machine=root.querySelector('.bf-machine'),sizing=root.querySelector('.bf-sizing'),stage=root.querySelector('.bf-stage'),settings=root.querySelector('.bf-settings'),inventory=root.querySelector('.bf-inventory');
 for(let i=0;i<36;i++){const slot=document.createElement('div');slot.className='bf-slot';inventory.appendChild(slot);}
 let wireless=true,running=true,open=true;
 const onWireless='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQAgMAAABinRfyAAAABGdBTUEAALGPC/xhBQAAAAFzUkdCAK7OHOkAAAAMUExURQAAAP//H/r6GOzsCLSzwfkAAAABdFJOUwBA5thmAAAAOUlEQVQI12NgQANb4xgYmK6GNzDwMjAUMHDoVihAxJgdGA8wMHE/aGBgMI0BqlPgABJAIaBqByTtAIWrCUzFK1vsAAAAAElFTkSuQmCC',offWireless='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQBAMAAADt3eJSAAAABGdBTUEAALGPC/xhBQAAAAFzUkdCAK7OHOkAAAAPUExURQAAANpHN///H/r6GOzsCA2DWUIAAAABdFJOUwBA5thmAAAAS0lEQVQIHQXBURGDMBAFwD1SAfeigGQqgA8EMMW/p+4CAEBDIffeb1Bz79X4hXxx1Vw94E5e+JzVx4MhcUHN1SAEqo+nGjFOAQDAH39HBOpSy5cbAAAAAElFTkSuQmCC',onPower='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAABGdBTUEAALGPC/xhBQAAAAFzUkdCAK7OHOkAAAC3UExURQAAACfIGynVHRyPEyCjFhBUCyS6GRBRCw9OCx2UFCKtFxqFEiS7GRFXDBRlDh2WFBd2EB2VFB6dFRqHEhFZDBNjDRuJEx6ZFRmAERd0EBh9ESbCGhVvDyGrFxFaDCCmFhRmDhBQCyGsFxyOEyS3GSfGGyW+GiXBGinSHCjQHCfJGyraHinTHTTiKDLhJQ1ECTjiLA9PCzfiKww8CAoxBws5CAo0Bwo1Bw1CCQksBgcmBSzhHzHhJEALCl0AAAABdFJOUwBA5thmAAAAb0lEQVQYGQXBAwICAQAAsF1dXbZt2/r/u9oAAAC8zgCA+xEAviePq98eYLO7uD0dtjFgGaz5vImtApBcAMy7IDMDyCVBOAToT0ClCNAMQXraAhrpMlAt9aCdjQMU6rUoGow6AIwTqVQiDwAAAAD4A5rbB1GwF5PbAAAAAElFTkSuQmCC',offPower='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAMAAAAoLQ9TAAAABGdBTUEAALGPC/xhBQAAAAFzUkdCAK7OHOkAAABLUExURQAAACUNDScODioPDyIMDC0QEBoJCRsKChkJCRwKCjARES8RETUTEx8LCyEMDCwQEDcUFCQNDSMNDR4LCx0LCykPDysQEDMSEhoKCiiMzbsAAAABdFJOUwBA5thmAAAAXklEQVQYGY3BVw4CMQxAwZe6TtlKvf9JwcFC8IHEDL/kO99y5sNtQzK9Y1LbEKHXyrCmBiJQW0KFKyatKH/BhIByDuM9ao+Yw6HicmaYY2SYS+GpnBbM9FJ4mwb+8wBaPAJx+Q38CAAAAABJRU5ErkJggg==';
 const wirelessButton=root.querySelector('#bf-wireless'),powerButton=root.querySelector('#bf-power'),settingsButton=root.querySelector('#bf-settings-toggle');
 function resize(){const stack=open&&stage.clientWidth<570;const width=open&&!stack?340:198;const height=open&&stack?396:299;const scale=Math.min(2.2,(stage.clientWidth-20)/width);sizing.style.width=`${width*scale}px`;sizing.style.height=`${height*scale}px`;machine.style.transform=`scale(${scale})`;settings.style.left=stack?'0px':'198px';settings.style.top=stack?'301px':'20px';}
 const fuelInput=root.querySelector('#bf-fuel'),availableInput=root.querySelector('#bf-available'),capInput=root.querySelector('#bf-cap');
 const coilInput=root.querySelector('#bf-coil');
 const coilNames=['白铜','坎塔尔','镍铬','钨钢','高速钢G','高速钢S','硅岩','硅岩合金','凯金','流明','觉醒龙','无尽','海珀珍','永恒'];
 coilNames.forEach((name,i)=>{const option=document.createElement('option');option.value=1801+900*i;option.textContent=name+' · '+option.value+'K';coilInput.appendChild(option);});
 const coilLimit=()=>Math.floor(4**((Number(coilInput.value)-901)/900-1));
 const fuels={luv:['超富集铂族苯',13940n],zpm:['ZPM苯',136200n],uv:['中子过饱和苯',1491000n],uhv:['UHV苯',18290000n],uev:['UEV苯',251500000n],uiv:['因果闭环苯',3876000000n],umv:['永恒调律苯',66950000000n],uxv:['苯征宇宙燃料',1296000000000n]};
 // Same integer arithmetic as the controller: whole B, floor batch EU once, then 100 ticks.
 const numerator=102n**4n*105n**4n,denominator=100n**8n;
 function fixed(n,d,places){const scale=10n**BigInt(places),v=n*scale/d,s=v.toString().padStart(places+1,'0');return places?s.slice(0,-places)+'.'+s.slice(-places):s;}
 function power(n){if(n>1000000000000n){const e=n.toString().length-1;return fixed(n,10n**BigInt(e),2)+'E'+e;}const suffix=['','K','M','G'];let d=1n,u=0;while(u<3&&n>=d*1000n){d*=1000n;u++;}return fixed(n,d,2)+suffix[u];}
 function rate(b){return fixed(b,5n,1).replace(/\.0$/,'');}
 function preview(){
   const available=Number(availableInput.value),cap=Number(capInput.value);
   if(availableInput.value===''||!availableInput.checkValidity()||!Number.isFinite(available))return {b:0n,eu:0n,status:'请输入有效燃料量'};
   if(capInput.value===''||!capInput.checkValidity()||!Number.isInteger(cap))return {b:0n,eu:0n,status:'燃料上限须为1～2147483647的整数'};
   if(!running)return {b:0n,eu:0n,status:'手动停机'};
   const b=BigInt(Math.min(Math.floor(available),cap,coilLimit()));
   if(b===0n)return {b,eu:0n,status:'燃料不足1B'};
   const eu=fuels[fuelInput.value][1]*b*1000n*numerator/denominator/100n;
   return {b,eu,status:'正在发电'};
 }
 function draw(){
   const p=preview();
   wirelessButton.setAttribute('aria-pressed',String(wireless));root.querySelector('.bf-wireless-icon').src=wireless?onWireless:offWireless;
   powerButton.setAttribute('aria-pressed',String(running));root.querySelector('.bf-power-icon').src=running?onPower:offPower;
   root.querySelector('.bf-mode').textContent=wireless?'开':'关';
   root.querySelector('.bf-fuel-name').textContent=fuels[fuelInput.value][0];
   root.querySelector('.bf-result').textContent=p.status;
   root.querySelector('.bf-result').style.color=p.b>0n?'#5df067':'#ffcd69';
   root.querySelector('.bf-multiplier').textContent=fixed(numerator,denominator,4)+'x';
   root.querySelector('.bf-generation').textContent=power(p.eu);
   root.querySelector('.bf-delivered').textContent=power(p.eu);
   root.querySelector('.bf-ratio').textContent=p.b>0n?'100.00':'0.00';
   root.querySelector('.bf-coil-state').textContent=coilInput.value+'K / 上限'+coilLimit()+'并行';
   root.querySelector('.bf-parallel').textContent=p.b+' / 设定'+capInput.value;
   root.querySelector('.bf-input').textContent=p.b+'B('+rate(p.b)+'B/s)';
   settings.hidden=!open;settingsButton.setAttribute('aria-expanded',String(open));resize();
 }
 function apply(state){const saved=state?.modelContent;if(saved?.preview==='generator-coil-gui-041'){
   wireless=saved.wireless!==false;running=saved.running!==false;
   capInput.value=Number.isInteger(saved.maximumBuckets)&&saved.maximumBuckets>=1&&saved.maximumBuckets<=2147483647?saved.maximumBuckets:1;
   fuelInput.value=Object.hasOwn(fuels,saved.fuel)?saved.fuel:'uv';
   availableInput.value=Number.isFinite(saved.availableBuckets)&&saved.availableBuckets>=0&&saved.availableBuckets<=2147483647?saved.availableBuckets:25;
   coilInput.value=coilNames.map((_,i)=>1801+900*i).includes(saved.coilHeat)?saved.coilHeat:1801;
   open=state.privateContent?.settingsOpen??true;
 }}
 function save(){if(!availableInput.checkValidity()||!capInput.checkValidity()||availableInput.value===''||capInput.value==='')return;window.openai?.setWidgetState({modelContent:{preview:'generator-coil-gui-041',coilHeat:Number(coilInput.value),wireless,running,maximumBuckets:Number(capInput.value),fuel:fuelInput.value,availableBuckets:Number(availableInput.value)},privateContent:{settingsOpen:open}})?.catch(()=>{});}
 apply(window.openai?.widgetState);draw();
 window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState;if(saved){apply(saved);draw();}});
 wirelessButton.addEventListener('click',()=>{wireless=!wireless;draw();save();});
 powerButton.addEventListener('click',()=>{running=!running;draw();save();});
 settingsButton.addEventListener('click',()=>{open=!open;draw();save();});
 for(const field of [fuelInput,availableInput,capInput,coilInput])field.addEventListener('input',()=>{draw();save();});
 capInput.addEventListener('change',e=>{e.target.value=Math.min(2147483647,Math.max(1,Math.trunc(Number(e.target.value)||1)));draw();save();});
 root.querySelector('#bf-structure').addEventListener('click',()=>{root.querySelector('.bf-result').textContent='结构完整';});
 new ResizeObserver(resize).observe(stage);
})();
</script>
