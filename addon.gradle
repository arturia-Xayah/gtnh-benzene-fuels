version = '0.4.6-alpha'
ext.modVersion = version
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
['compileJava', 'compileTestJava', 'compileInjectedTagsJava'].each { name ->
    tasks.named(name, JavaCompile) { options.release = 8 }
}
if (providers.gradleProperty('benzeneFuelsTests').getOrElse('false').toBoolean()) {
    sourceSets.main.java.srcDir('src/packTest/java')
}
tasks.named('jar') { archiveBaseName = 'benzenefuels' }
tasks.register('verifyDistribution') {
    dependsOn(tasks.named('reobfJar'))
    inputs.file(tasks.named('reobfJar').flatMap { it.archiveFile })
    inputs.property('testBuild', providers.gradleProperty('benzeneFuelsTests').getOrElse('false'))
    doLast { task ->
        new java.util.zip.ZipFile(task.inputs.files.singleFile).withCloseable { zip ->
            def count = 0
            zip.entries().each { entry ->
                if (entry.name.endsWith('.class')) {
                    count++
                    def bytes = zip.getInputStream(entry).bytes
                    def major = ((bytes[6] & 255) << 8) | (bytes[7] & 255)
                    if (major > 52) throw new GradleException('Non-Java-8 class: ' + entry.name)
                    if (entry.name.contains('/packtest/') && task.inputs.properties.testBuild != 'true')
                        throw new GradleException('Test fixture leaked into runtime JAR')
                }
            }
            if (count == 0 || !zip.getEntry('dev/benzenefuels/BenzeneFuels.class'))
                throw new GradleException('Missing mod entry point')
            ['zh_CN', 'en_US'].each { language ->
                if (!zip.getEntry('assets/benzenefuels/lang/' + language + '.lang'))
                    throw new GradleException('Missing localization: ' + language)
            }
            logger.lifecycle('Verified ' + count + ' Java 8 classes.')
        }
    }
}
tasks.named('check') { dependsOn(tasks.named('verifyDistribution')) }
