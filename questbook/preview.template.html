<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>苯向星辰 · Quest chapter preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#191d26;color:#e5e8ef;font:15px/1.7 system-ui,sans-serif}header{padding:24px 32px;border-bottom:1px solid #465065;display:flex;gap:24px;align-items:center}h1{font-size:26px;margin:0;font-weight:600}header p{margin:2px 0;color:#afb9cb;font-size:13px}button{font:inherit;color:inherit;cursor:pointer}header button{margin-left:auto;padding:6px 18px;background:#303948;border:1px solid #8390a7;border-radius:4px}main{display:grid;grid-template-columns:minmax(0,1fr) 355px;gap:24px;padding:24px 32px}.map-scroll{overflow:auto;min-width:0}.map{position:relative;width:1060px;height:825px;background-image:radial-gradient(#495264 1px,transparent 1px);background-size:24px 24px}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.edge{stroke:#6a768c;stroke-width:1.2;fill:none;opacity:.65}.edge.active{stroke:#e2bd69;stroke-width:2.4;opacity:1}.node{position:absolute;background:#353d49;border:2px solid #9eabbd;box-shadow:inset 0 0 0 2px #151b26;padding:0;display:grid;place-items:center}.node.major{border-color:#d9b965}.node.info{border-color:#8ca8be}.node.magic{border-color:#bc91cc}.node.native{border-style:dashed;background:#252c37;color:#c0c8d8}.node.selected{outline:3px solid #f1dc9d;outline-offset:4px}.node .art{width:24px;height:24px;background-repeat:no-repeat;background-position:top center;background-size:24px auto;image-rendering:pixelated}.node .label{position:absolute;top:100%;margin-top:8px;width:85px;color:#dfe4ee;font-size:12px;line-height:1.3;text-align:center;pointer-events:none}.node .code{font-size:10px}.lane{position:absolute;left:18px;font-size:12px;color:#a1b2c8;letter-spacing:.08em;border-bottom:1px solid #424b5b;padding:0 0 6px;width:1024px;pointer-events:none}aside{padding:22px;background:#252c37;border:1px solid #465065;align-self:start;position:sticky;top:20px;min-height:540px}h2{font-size:20px;line-height:1.5;margin:0 0 16px}.desc{white-space:pre-line;color:#d4dae5;line-height:1.85}.meta{font-size:12px;color:#b8c8d9;border-top:1px solid #505b6d;margin-top:22px;padding-top:14px}.hint{display:block;color:#a5b3c8;font-size:12px;margin-top:14px}.note{color:#a6c9d5}.warn{color:#e4be83}.legend{display:flex;gap:22px;flex-wrap:wrap;color:#bdc8d9;font-size:12px;margin-bottom:14px}.legend span:before{content:'■';margin-right:7px;color:#d9b965}.legend span:nth-child(2):before{color:#8ca8be}.legend span:nth-child(3):before{color:#bc91cc}.legend span:nth-child(4):before{color:#a1aabb}@media(max-width:1100px){main{grid-template-columns:minmax(0,1fr);padding:18px}aside{position:static}header{padding:18px;gap:12px}h1{font-size:22px}}
</style>
<header><div><h1 id="title">苯向星辰</h1><p id="subtitle">GTNH 2.9.0 · 46 个新任务 + 7 个原版前置 · 按实际任务坐标生成</p></div><button id="language" type="button">English</button></header>
<main><section><div class="legend"><span>燃料 / Fuel</span><span>工程 · 科技 / Engineering · Tech</span><span>魔法 / Magic</span><span>原版引用 / Native references</span></div><div class="map-scroll"><div class="map" id="map"><svg id="edges" aria-hidden="true"></svg></div></div><span class="hint">任务布局与文案预览，并非游戏截图。点击节点查看任务、前置与奖励。 / Layout and text preview, not an in-game screenshot.</span></section><aside aria-live="polite"><h2 id="name"></h2><div class="desc" id="description"></div><div class="meta" id="details"></div></aside></main>
<script id="data" type="application/json">__QUEST_DATA__</script>
<script>
const rows=JSON.parse(document.getElementById('data').textContent), byKey=new Map(rows.map(r=>[r.key,r]));
let language='zh_CN', selected='fuel_luv';
const map=document.getElementById('map'), svg=document.getElementById('edges');
const positions=new Map(rows.map(r=>[r.key,{x:r.x+52+r.size/2,y:r.y+68+r.size/2}]));
const lanes=[{y:8,zh:'原版设备前置',en:'Native machine milestones'},{y:168,zh:'燃料主线',en:'Fuel progression'}, {y:352,zh:'UV 发电塔 · 工程说明',en:'UV generator · Engineering reference'}, {y:472,zh:'科技侧 · 说明支线',en:'Technology · Reference'}, {y:568,zh:'魔法侧 · 说明支线',en:'Magic · Reference'}, {y:712,zh:'电压之星 · 独立制造支线',en:'Voltage stars · Manufacturing'}];
function plain(value){return value.replace(/§./g,'')}
function render(){
 map.querySelectorAll('button,.lane').forEach(n=>n.remove());svg.replaceChildren();
 lanes.forEach(l=>{let e=document.createElement('div');e.className='lane';e.style.top=l.y+'px';e.textContent=language==='zh_CN'?l.zh:l.en;map.append(e)});
 rows.forEach(r=>r.parents.forEach(p=>{const a=positions.get(p), b=positions.get(r.key);if(!a)return;let edge=document.createElementNS('http://www.w3.org/2000/svg','path');edge.setAttribute('d',`M${a.x} ${a.y} L${b.x} ${b.y}`);edge.setAttribute('class','edge'+(r.key===selected?' active':''));svg.append(edge)}));
 rows.forEach(r=>{let button=document.createElement('button');button.type='button';button.className='node '+r.kind+(r.key===selected?' selected':'');button.style.cssText=`left:${r.x+52}px;top:${r.y+68}px;width:${r.size}px;height:${r.size}px`;button.setAttribute('aria-label',plain(r[language].name));button.setAttribute('aria-pressed',r.key===selected);button.dataset.key=r.key;
 if(r.art){let image=document.createElement('span');image.className='art';image.style.backgroundImage=`url("${r.art}")`;button.append(image)}else{let code=document.createElement('span');code.className='code';code.textContent=r.symbol;button.append(code)}
 let label=document.createElement('span');label.className='label';label.textContent=r.short[language];button.append(label);button.addEventListener('click',()=>{selected=r.key;render()});map.append(button)});
 const q=byKey.get(selected), t=q[language];document.getElementById('name').textContent=plain(t.name);
 const description=document.getElementById('description');description.replaceChildren();
 plain(t.desc).split(/(\[(?:note|warn)\][\s\S]*?\[\/(?:note|warn)\])/g).forEach(part=>{let span=document.createElement('span');span.className=part.startsWith('[note]')?'note':part.startsWith('[warn]')?'warn':'';span.textContent=part.replace(/\[\/?(?:note|warn)\]/g,'');description.append(span)});
 document.getElementById('details').textContent=(language==='zh_CN'?'前置：':'Prerequisites: ')+(q.parents.map(p=>plain(byKey.get(p)[language].name)).join(' · ')||(language==='zh_CN'?'无':'None'))+'\n'+t.task+'\n'+t.reward;
 document.getElementById('details').style.whiteSpace='pre-line';
 document.getElementById('title').textContent=language==='zh_CN'?'苯向星辰':'Benzene Beyond the Horizon';document.getElementById('language').textContent=language==='zh_CN'?'English':'简体中文';document.getElementById('subtitle').textContent=language==='zh_CN'?'GTNH 2.9.0 · 46 个新任务 + 7 个原版前置 · 按实际任务坐标生成':'GTNH 2.9.0 · 46 new quests + 7 native prerequisites · Actual chapter coordinates';
}
document.getElementById('language').addEventListener('click',()=>{language=language==='zh_CN'?'en_US':'zh_CN';render()});render();
</script>
</html>
