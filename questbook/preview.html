<script id="data" type="application/json">[{"key": "welcome", "x": 0, "y": 144, "size": 32, "parents": [], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/cell_luv.png", "short": {"zh_CN": "启程", "en_US": "Begin"}, "zh_CN": {"name": "苯，未完待续", "desc": "你以为硝基苯就是终点了？你的树场可不这么想。本章把这条熟悉的燃料线继续延伸，从 LuV 一路走到 UXV。每次升级都保留原有燃料体积，但加工设备和添加物会越来越昂贵。\n\n沿上方主线升级燃料，下方支线介绍共振燃料发电塔、科技与魔法强化，以及电压之星。主线上方的原版任务是真正的前置，不需要重复做一遍。\n\n[note]流体任务检测背包中的流体容器，不会收走燃料。GT 配方把 1mB 称为 1L，而本机的并行设置以 1000mB＝1B 计量。本章配方统一写 mB，别把两种口径混在一起。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "Benzene Has Left the Building", "desc": "You thought Nitrobenzene was the end of the line? Your tree farm has other plans. This chapter takes that familiar fuel through eight upgrades, from LuV to UXV. Every step keeps the same amount of fuel, but asks for increasingly expensive processing and additives.\n\nFollow the upper row for the fuel chain. The lower branches cover the Resonance Fuel Generator, its two upgrade routes, and Voltage Stars. Existing GTNH quests above the fuel row are real prerequisites, not additional copies to complete.\n\n[note]Fluid tasks detect containers in your inventory without consuming them. GT recipes call 1 mB one litre; this generator's parallel setting uses 1000 mB = 1 B. All recipe quantities here are written in mB to keep the two conventions apart.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "platinum_activator", "x": 192, "y": 72, "size": 24, "parents": ["welcome", "native_3133", "native_1412", "native_1212"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/component_activator.png", "short": {"zh_CN": "铂族活化剂", "en_US": "PG activator"}, "zh_CN": {"name": "§d§l贵金属，贵有贵的道理", "desc": "先准备装配线和稳定的氦等离子体供应。扫描铂粉后，将铂、铑、钯、铱、钌粉各 1024 个，与 16,384mB 氦等离子体送入装配线，以 LuV 电压加工 10 秒，得到一个活化剂。\n\n这个小东西会被消耗。每个活化剂能升级 50,000mB 硝基苯，所以如果铂族处理线还靠手动搬运，你的“可再生能源”恐怕不会太轻松。\n\n[note]把活化剂送进反应釜之前，先在背包里检测一下。任务不会收走它。[/note]", "task": "检测指定物品，不消耗。", "reward": "一次性奖励：1 × 化学家硬币 III"}, "en_US": {"name": "§d§lA Very Noble Expense", "desc": "Start with the Assembly Line and a steady supply of Helium Plasma. Scan Platinum Dust, then combine 1024 dust each of Platinum, Rhodium, Palladium, Iridium and Ruthenium with 16,384 mB of Helium Plasma. The line runs at LuV for 10 seconds to make one activator.\n\nThis little component is consumed. Each one upgrades 50,000 mB of Nitrobenzene, so an unautomated platinum-group line is going to make this fuel rather less renewable than your tree farm suggests.\n\n[note]Detect the activator before sending it to the reactor. This task does not consume it.[/note]", "task": "Detect the specified item without consuming it.", "reward": "One-time reward: 1 × ChemistIII coin"}}, {"key": "uv_activator", "x": 384, "y": 72, "size": 24, "parents": ["fuel_zpm"], "kind": "info", "symbol": "•", "art": "", "short": {"zh_CN": "UV 活化液", "en_US": "UV activator"}, "zh_CN": {"name": "§2§l§n再加一点中子", "desc": "在大型化学反应釜中，将 1024 个中子素粉、1024 个宇宙中子素粉与 16,384mB 镅等离子体，以 UV 电压加工 10 秒。产出的 144mB UV 活化液，正好够下一步升级一批燃料。\n\n这个中间产物是流体。用合适的流体容器在背包里检测 144mB，再送去聚变；本模组并没有单独注册一种活化液单元。", "task": "检测 144mB 流体，不消耗。", "reward": "一次性奖励：1 × 化学家硬币 III"}, "en_US": {"name": "§2§l§nJust Add More Neutrons", "desc": "In a Large Chemical Reactor, process 1024 Neutronium Dust, 1024 Cosmic Neutronium Dust and 16,384 mB of Americium Plasma at UV for 10 seconds. You receive 144 mB of UV Activator, exactly enough for one fuel-upgrade batch.\n\nThis intermediate is a fluid. Use a suitable fluid container to detect 144 mB, then send it on to fusion. Do not search for an activator cell that this mod does not register.", "task": "Detect 144 mB in containers, without consumption.", "reward": "One-time reward: 1 × ChemistIII coin"}}, {"key": "quantum_catalyst", "x": 576, "y": 72, "size": 24, "parents": ["fuel_uhv", "native_3287"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/catalyst_quantum.png", "short": {"zh_CN": "量子催化剂", "en_US": "QFT catalyst"}, "zh_CN": {"name": "§5§l§n这次真的不消耗", "desc": "用 UEV 组装机将铂粉、钯粉、铱粉各 8 个，一个 UEV 力场发生器，以及 144mB 熔融无尽加工 10 秒，得到苯量子催化剂。\n\n把它放进 QFT 的大宗催化剂仓，不是普通输入总线。每个并行需要一个，但不必每批重做。UEV 到 UXV 的四级燃料共用这一种催化剂。", "task": "检测指定物品，不消耗。", "reward": "一次性奖励：2 × 化学家硬币 III"}, "en_US": {"name": "§5§l§nThis One Comes Back", "desc": "An UEV Assembler combines 8 dust each of Platinum, Palladium and Iridium with one UEV Field Generator and 144 mB of Molten Infinity. After 10 seconds you have a Benzene Quantum Catalyst.\n\nPut it in the QFT Bulk Catalyst Housing, not into a normal input bus. You need one per parallel, but you do not need to remake it for every batch. UEV through UXV all use this same catalyst.", "task": "Detect the specified item without consuming it.", "reward": "One-time reward: 2 × ChemistIII coin"}}, {"key": "fuel_luv", "x": 192, "y": 144, "size": 32, "parents": ["platinum_activator"], "kind": "major", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/cell_luv.png", "short": {"zh_CN": "LUV", "en_US": "LUV"}, "zh_CN": {"name": "§d§lLuV — 超富集铂族苯", "desc": "将一个铂族活化剂和 50,000mB 硝基苯送入大型化学反应釜，以 LuV 电压加工 10 秒，得到等体积燃料。这一步会消耗活化剂，不会再收一次等离子体。\n\n你的树场现在有了贵金属供应商。把活化剂生产和燃料缓冲分开，别让一次短缺把发电机已有的口粮也抽走。\n\n基础热值：13,940EU/mB，即每 1000mB 为 13,940,000EU，尚未计算发电机效率。携带装有合计 16,000mB 燃料的容器进行检测，不会消耗燃料。", "task": "检测 16,000mB 流体，不消耗。", "reward": "一次性奖励：2 × 化学家硬币 III"}, "en_US": {"name": "§d§lLuV — Hyper-Enriched Platinum-Group Benzene", "desc": "Feed one Platinum-Group Activator and 50,000 mB of Nitrobenzene into a Large Chemical Reactor. Ten seconds at LuV gives 50,000 mB of fuel. The activator is consumed; there is no second plasma payment at this step.\n\nYour tree farm now has a precious-metal dependency. Keep the activator production separate from the fuel buffer so a temporary shortage does not drain the fuel already available to your generators.\n\nFuel value: 13,940 EU/mB (13,940,000 EU per 1000 mB), before generator efficiency. Bring 16,000 mB in fluid containers for detection; nothing is consumed.", "task": "Detect 16,000 mB in containers, without consumption.", "reward": "One-time reward: 2 × ChemistIII coin"}}, {"key": "fuel_zpm", "x": 288, "y": 144, "size": 32, "parents": ["fuel_luv", "native_1197"], "kind": "major", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/cell_zpm.png", "short": {"zh_CN": "ZPM", "en_US": "ZPM"}, "zh_CN": {"name": "§b§lZPM — ZPM苯", "desc": "将 50,000mB LuV 燃料与 163,840mB 锡等离子体聚变，得到 50,000mB ZPM 苯。配方耗时 10 秒，电压 ZPM，启动能量 280M EU，因此普通聚变反应堆需要 MkII 或更高。\n\n这里不需要镅粉、三钛粉或铕粉。全部添加物就是锡等离子体，而且量可不小。先攒够一整批，再往反应堆送料。\n\n基础热值：136,200EU/mB，即每 1000mB 为 136,200,000EU，尚未计算发电机效率。携带装有合计 16,000mB 燃料的容器进行检测，不会消耗燃料。", "task": "检测 16,000mB 流体，不消耗。", "reward": "一次性奖励：2 × 化学家硬币 III"}, "en_US": {"name": "§b§lZPM — ZPM Benzene", "desc": "Fuse 50,000 mB of LuV fuel with 163,840 mB of Tin Plasma. The recipe takes 10 seconds at ZPM and needs 280M EU of startup energy, so the ordinary Fusion Reactor must be MkII or better.\n\nNo Americium, Tritanium or Europium dust is used here. Tin Plasma is the entire additive bill, and it is a large one. Buffer enough for a complete recipe before feeding the reactor.\n\nFuel value: 136,200 EU/mB (136,200,000 EU per 1000 mB), before generator efficiency. Bring 16,000 mB in fluid containers for detection; nothing is consumed.", "task": "Detect 16,000 mB in containers, without consumption.", "reward": "One-time reward: 2 × ChemistIII coin"}}, {"key": "fuel_uv", "x": 384, "y": 144, "size": 32, "parents": ["uv_activator", "native_1202"], "kind": "major", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/cell_uv.png", "short": {"zh_CN": "UV", "en_US": "UV"}, "zh_CN": {"name": "§2§l§nUV — 中子过饱和苯", "desc": "将 50,000mB ZPM 苯和 144mB UV 活化液送入聚变反应堆。配方以 UV 电压运行 10 秒，启动能量 500M EU，普通 MkIII 聚变反应堆能够处理。\n\n它仍然属于燃气轮机燃料。不过，热值变高并不会让旧动力仓凭空多出吞吐量。扩产之前，先检查燃料流量和输出额定值。\n\n基础热值：1,491,000EU/mB，即每 1000mB 为 1,491,000,000EU，尚未计算发电机效率。携带装有合计 16,000mB 燃料的容器进行检测，不会消耗燃料。", "task": "检测 16,000mB 流体，不消耗。", "reward": "一次性奖励：2 × 化学家硬币 III"}, "en_US": {"name": "§2§l§nUV — Neutron-Supersaturated Benzene", "desc": "Send 50,000 mB of ZPM Benzene and 144 mB of UV Activator into fusion. This is a 10-second UV recipe with a 500M EU startup requirement. A normal MkIII reactor can handle it.\n\nThis is still a gas-turbine fuel. Higher energy density does not mean that an old dynamo suddenly has more throughput, though. Check the fuel flow and the output rating before scaling the line.\n\nFuel value: 1,491,000 EU/mB (1,491,000,000 EU per 1000 mB), before generator efficiency. Bring 16,000 mB in fluid containers for detection; nothing is consumed.", "task": "Detect 16,000 mB in containers, without consumption.", "reward": "One-time reward: 2 × ChemistIII coin"}}, {"key": "fuel_uhv", "x": 480, "y": 144, "size": 32, "parents": ["fuel_uv", "native_2959"], "kind": "major", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/cell_uhv.png", "short": {"zh_CN": "UHV", "en_US": "UHV"}, "zh_CN": {"name": "§4§l§nUHV — UHV苯", "desc": "硅岩燃料精炼厂找到了第二份工作。投入 50,000mB UV 燃料、1024 个无尽催化剂粉、1024 个原子分离催化剂粉，以及 17,856mB 熔融无尽。配方以 UHV 电压运行 10 秒，精炼厂至少需要 1 级线圈。\n\n两种粉末每批都会消耗。“催化剂”写在名字里，不代表机器一定会把它还给你。\n\n基础热值：18,290,000EU/mB，即每 1000mB 为 18,290,000,000EU，尚未计算发电机效率。携带装有合计 16,000mB 燃料的容器进行检测，不会消耗燃料。", "task": "检测 16,000mB 流体，不消耗。", "reward": "一次性奖励：3 × 化学家硬币 III"}, "en_US": {"name": "§4§l§nUHV — UHV Benzene", "desc": "The Naquadah Fuel Refinery has found a second job. Combine 50,000 mB of UV fuel, 1024 Infinity Catalyst Dust, 1024 Atomic Separation Catalyst Dust and 17,856 mB of Molten Infinity. This takes 10 seconds at UHV and requires at least tier 1 refinery coils.\n\nBoth dust ingredients are consumed every batch. The word catalyst in an ingredient name is not a promise that you will get it back.\n\nFuel value: 18,290,000 EU/mB (18,290,000,000 EU per 1000 mB), before generator efficiency. Bring 16,000 mB in fluid containers for detection; nothing is consumed.", "task": "Detect 16,000 mB in containers, without consumption.", "reward": "One-time reward: 3 × ChemistIII coin"}}, {"key": "fuel_uev", "x": 576, "y": 144, "size": 32, "parents": ["quantum_catalyst", "native_3287"], "kind": "major", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/cell_uev.png", "short": {"zh_CN": "UEV", "en_US": "UEV"}, "zh_CN": {"name": "§5§l§nUEV — UEV苯", "desc": "量子力变换机的配方等级至少要达到 2 级。每批投入 50,000mB UHV 燃料、1024 个超越金属粉、1024 个海珀珍粉，以及 17,856mB 熔融无尽，以 UEV 电压运行 10 秒。\n\n每个并行在大宗催化剂仓里留一个苯量子催化剂。它与精炼厂消耗的粉末不同，可以重复使用。苯配方只有一种必定产出的流体，不会套用其他 QFT 配方的随机分流。\n\n基础热值：251,500,000EU/mB，即每 1000mB 为 251,500,000,000EU，尚未计算发电机效率。携带装有合计 16,000mB 燃料的容器进行检测，不会消耗燃料。", "task": "检测 16,000mB 流体，不消耗。", "reward": "一次性奖励：3 × 化学家硬币 III"}, "en_US": {"name": "§5§l§nUEV — UEV Benzene", "desc": "Use a tier 2 or better Quantum Force Transformer recipe setup. Each batch takes 50,000 mB of UHV fuel, 1024 Transcendent Metal Dust, 1024 Hypogen Dust and 17,856 mB of Molten Infinity, and runs for 10 seconds at UEV.\n\nKeep a Benzene Quantum Catalyst in a Bulk Catalyst Housing for each parallel. Unlike the refinery powders, this catalyst is reusable. The benzene recipe has one guaranteed fluid output; it does not inherit the random output split of unrelated QFT recipes.\n\nFuel value: 251,500,000 EU/mB (251,500,000,000 EU per 1000 mB), before generator efficiency. Bring 16,000 mB in fluid containers for detection; nothing is consumed.", "task": "Detect 16,000 mB in containers, without consumption.", "reward": "One-time reward: 3 × ChemistIII coin"}}, {"key": "fuel_uiv", "x": 672, "y": 144, "size": 32, "parents": ["fuel_uev"], "kind": "major", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/cell_uiv.png", "short": {"zh_CN": "UIV", "en_US": "UIV"}, "zh_CN": {"name": "§9§l§nUIV — 因果闭环苯", "desc": "将 QFT 配方等级提升到至少 3 级。每批投入 50,000mB UEV 燃料、2048 个超越金属粉、2048 个海珀珍粉，以及 17,856mB 熔融时空。仍然运行 10 秒，但电压提升为 UIV。可复用的苯量子催化剂继续留在仓内。\n\n[warn]从 UIV 开始，热值超过原生 GT 燃气燃料表的整数上限，因此不再注册进原生燃气轮机。做出来不代表旧轮机就能烧它。共振发电塔能够读取完整热值，但它的生存入口材料配方仍待定。[/warn]\n\n基础热值：3,876,000,000EU/mB，即每 1000mB 为 3,876,000,000,000EU，尚未计算发电机效率。携带装有合计 16,000mB 燃料的容器进行检测，不会消耗燃料。", "task": "检测 16,000mB 流体，不消耗。", "reward": "一次性奖励：3 × 化学家硬币 III"}, "en_US": {"name": "§9§l§nUIV — Causal-Loop Benzene", "desc": "Raise the QFT recipe tier to at least 3. Combine 50,000 mB of UEV fuel with 2048 Transcendent Metal Dust, 2048 Hypogen Dust and 17,856 mB of Molten Space-Time. The processing time is still 10 seconds, now at UIV. Keep the reusable Benzene Quantum Catalyst installed.\n\n[warn]UIV is the first fuel in this line that is not registered in the native GT gas-turbine fuel map: its heat value exceeds that map's integer limit. Producing it does not make a native gas turbine accept it. The resonance generator understands its full heat value, but its survival entry components remain pending.[/warn]\n\nFuel value: 3,876,000,000 EU/mB (3,876,000,000,000 EU per 1000 mB), before generator efficiency. Bring 16,000 mB in fluid containers for detection; nothing is consumed.", "task": "Detect 16,000 mB in containers, without consumption.", "reward": "One-time reward: 3 × ChemistIII coin"}}, {"key": "fuel_umv", "x": 768, "y": 144, "size": 32, "parents": ["fuel_uiv"], "kind": "major", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/cell_umv.png", "short": {"zh_CN": "UMV", "en_US": "UMV"}, "zh_CN": {"name": "§5§l§nUMV — 永恒调律苯", "desc": "这次需要 4 级 QFT 配方处理能力。每批使用 50,000mB UIV 燃料、熔融 Shirabon与熔融永恒各 144mB，以及 16mB 熔融白矮星物质，以 UMV 电压运行 10 秒，得到等体积的新燃料。\n\n与前几步相比，添加物数量看起来很小。为了做出它们而建造的工厂可一点都不小。给这些流体安排独立过滤输入，并保留通用的苯量子催化剂。\n\n基础热值：66,950,000,000EU/mB，即每 1000mB 为 66,950,000,000,000EU，尚未计算发电机效率。携带装有合计 16,000mB 燃料的容器进行检测，不会消耗燃料。", "task": "检测 16,000mB 流体，不消耗。", "reward": "一次性奖励：3 × 化学家硬币 III"}, "en_US": {"name": "§5§l§nUMV — Eternally Attuned Benzene", "desc": "Tier 4 QFT processing is required now. One batch uses 50,000 mB of UIV fuel, 144 mB each of Molten Shirabon and Molten Eternity, plus 16 mB of Molten White Dwarf Matter. Ten seconds at UMV gives the same volume of upgraded fuel.\n\nThe additive amounts look small after the previous steps. The infrastructure needed to make them is not. Give these fluids their own filtered inputs and keep the shared catalyst in place.\n\nFuel value: 66,950,000,000 EU/mB (66,950,000,000,000 EU per 1000 mB), before generator efficiency. Bring 16,000 mB in fluid containers for detection; nothing is consumed.", "task": "Detect 16,000 mB in containers, without consumption.", "reward": "One-time reward: 3 × ChemistIII coin"}}, {"key": "fuel_uxv", "x": 864, "y": 144, "size": 32, "parents": ["fuel_umv"], "kind": "major", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/cell_uxv.png", "short": {"zh_CN": "UXV", "en_US": "UXV"}, "zh_CN": {"name": "§6§l§nUXV — 苯征宇宙燃料", "desc": "你的树场现在成了处理恒星物质的一个相当复杂的借口。在 4 级 QFT 中，将 50,000mB UMV 燃料与 124mB 熔融宇宙素、124mB 熔融磁流体约束恒星物质、1984mB 原始恒星物质，以及 144mB 熔融永恒混合，以 UXV 电压运行 10 秒。仍需保留可复用催化剂。\n\n这就是目前燃料线的终点。任务检测的是实际燃料，不是一笔承诺发给你的电：真正的发电量还取决于可工作的发电机、底数流体供应和已安装的升级。\n\n基础热值：1,296,000,000,000EU/mB，即每 1000mB 为 1,296,000,000,000,000EU，尚未计算发电机效率。携带装有合计 16,000mB 燃料的容器进行检测，不会消耗燃料。", "task": "检测 16,000mB 流体，不消耗。", "reward": "一次性奖励：8 × 化学家硬币 III"}, "en_US": {"name": "§6§l§nUXV — Eigenbenzene Cosmic Fuel", "desc": "Your tree farm has become a rather elaborate excuse to process stellar matter. In a tier 4 QFT, combine 50,000 mB of UMV fuel with 124 mB of Molten Universium, 124 mB of Molten Magnetohydrodynamically Constrained Star Matter, 1984 mB of Raw Star Matter and 144 mB of Molten Eternity. Supply UXV for 10 seconds and keep the reusable catalyst installed.\n\nThis is the last upgrade currently available. The task checks the fuel itself, not a promised generator output: generation still depends on a working generator, supplied base fluids and the installed upgrades.\n\nFuel value: 1,296,000,000,000 EU/mB (1,296,000,000,000,000 EU per 1000 mB), before generator efficiency. Bring 16,000 mB in fluid containers for detection; nothing is consumed.", "task": "Detect 16,000 mB in containers, without consumption.", "reward": "One-time reward: 8 × ChemistIII coin"}}, {"key": "gas_generators", "x": 192, "y": 228, "size": 24, "parents": ["fuel_luv"], "kind": "info", "symbol": "•", "art": "", "short": {"zh_CN": "燃气发电", "en_US": "Gas power"}, "zh_CN": {"name": "先看清楚油箱盖", "desc": "LuV 至 UEV 的苯已注册为原生 GT 燃气轮机燃料。这说明它们能进入对应燃料表，不代表任意转子与动力仓都能合适地处理它们。热值、涡轮效率、最优流量与输出容量，是四件不同的事。\n\nUIV、UMV、UXV 不在原生燃气燃料表里。注册成燃气也不会自动让火箭引擎接受它。规划电站前，先在 NEI 中确认实际的燃料分类。\n\n[note]升级保留的是流体体积，不是加工成本。比较整条产线时，要把一路用掉的电和添加物也算进去。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "Read the Fine Print", "desc": "LuV through UEV Benzene are registered as native GT gas-turbine fuels. That makes them fuel candidates, not a guarantee that every rotor or dynamo is suitable. Heat value, turbine efficiency, optimal flow and output capacity are different numbers.\n\nUIV, UMV and UXV are not on that native fuel map. Nor does a gas registration automatically make any fuel a rocket-engine fuel. Check the actual recipe category in NEI before designing your power plant.\n\n[note]A fuel upgrade keeps the fluid volume, not the processing cost. Include the electricity and additives used along the way when comparing a complete power line.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "automation", "x": 672, "y": 228, "size": 24, "parents": ["fuel_uev"], "kind": "info", "symbol": "•", "art": "", "short": {"zh_CN": "产线自动化", "en_US": "Automation"}, "zh_CN": {"name": "一根管子，一份工作", "desc": "各级燃料之间留缓冲，也给仍在使用的低级发电机预留口粮。每次升级处理的是完整的 50,000mB；一个没有限制的共用输出总线，可能在新电站还没建好时，就先把旧电站饿停。\n\nQFT 的可复用催化剂留在仓里，消耗性添加物单独请求，产物过滤回各自的储罐。八级燃料任务都是一次性里程碑，不是靠来回搬运同一桶燃料反复刷奖励的生意。", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "One Pipe, One Job", "desc": "Keep a buffer between each fuel tier and reserve the lower-tier fuel you still burn. These recipes upgrade the entire 50,000 mB batch; a shared export bus with no limits can starve the old power plant while the new one is still being built.\n\nFor QFT, keep the reusable catalyst in its housing, request the consumable additives separately and filter the output back into its own tank. The eight fuel tasks are one-time milestones. They are not repeatable rewards for circulating the same fuel.", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "tower", "x": 288, "y": 336, "size": 24, "parents": ["fuel_uv"], "kind": "info", "symbol": "UV", "art": "", "short": {"zh_CN": "发电塔前置", "en_US": "UV generator"}, "zh_CN": {"name": "§2§l§n电站也要有高度", "desc": "按 UV 阶段规划这项工程。整座塔尺寸为 33×33×129，先找地，再下材料订单。主机位于底部以上两格；主机放在 Y=2～129，才能让整座结构落在普通世界的高度范围内。\n\n你需要用于聚变机械方块的聚变基础设施、量子玻璃、大量工业机械方块，以及 1648 个同级加热线圈。UV 是计划中的入口阶段，不表示当前尚缺配方的主机已经能在生存模式合成。\n\n[note]这是说明支线。底数流体、指数核心、主机和导光外壳的生存合成配方尚未确定。阅读后勾选即可，不要求提交，也不会奖励待定材料；这条支线不阻挡燃料主线。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "§2§l§nA Power Plant with Altitude", "desc": "Plan this project around UV progression. The complete tower is 33×33×129, so find a site before ordering the blocks. Its controller sits two blocks above the bottom; controller Y=2 through 129 keeps the whole structure within the normal world height.\n\nYou will need fusion infrastructure for fusion casings, quantum glass, a large collection of industrial casings and 1648 matching heating coils. UV is the intended entry stage, not a claim that the currently missing controller recipe can be crafted.\n\n[note]This is a reference branch. Survival recipes for base fluids, exponent cores, the controller and its light casing are not yet defined. Read and check the box; no pending material is requested or awarded, and this branch does not gate the fuel chain.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "tower_materials", "x": 384, "y": 336, "size": 24, "parents": ["tower"], "kind": "info", "symbol": "▦", "art": "", "short": {"zh_CN": "外壳备料", "en_US": "Casings"}, "zh_CN": {"name": "先让工厂做外壳", "desc": "默认结构一共使用 15,472 个方块。最大的几笔订单是 3628 个量子玻璃、1940 个洁净不锈钢机械方块、1648 个加热线圈、1423 个聚变机械方块，以及 1215 个坚固钢机械方块。此外还有 621 个蓝白共振导光外壳。\n\n其余用料包括防冻、格栅、过滤、化学惰性、魔法与遏制场机械方块，冷却和聚四氟乙烯管道，超导线圈，以及少量装饰件。完整位置请看结构预览。下面的清单只是可选的备料提示，不要求把整座塔塞进背包。", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "Order the Casings First", "desc": "The default structure contains 15,472 blocks. The largest orders are 3628 Quantum Glass, 1940 Clean Stainless Steel Machine Casings, 1648 heating coils, 1423 Fusion Machine Casings and 1215 Solid Steel Machine Casings. It also uses 621 Blue-White Resonance Light Casings.\n\nOther materials include frost-proof, grating, filter, chemically inert, magic and field-containing casings, cooling and PTFE pipes, superconducting coils and small decorative parts. Use the structure preview for the full arrangement. The list below is an optional planning checklist, not a demand to put an entire tower into your inventory.", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "tower_coils", "x": 480, "y": 336, "size": 24, "parents": ["tower_materials"], "kind": "info", "symbol": "Ω", "art": "", "short": {"zh_CN": "线圈并行", "en_US": "Coils"}, "zh_CN": {"name": "线圈决定胃口", "desc": "全部 1648 个线圈必须同级。白铜支持 1 并行，坎塔尔支持 4，并行上限到永恒线圈为 67,108,864。计算式为 floor(4^((热量−901)/900−1))，除法按实数计算。混用线圈不能成型。\n\n每个并行每五秒消耗 1000mB 燃料。实际并行取设置上限、线圈上限和可用燃料整桶数中的最小值。更好的线圈提高的是上限，可不会凭空变出燃料。", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "More Coils, More Batches", "desc": "All 1648 coils must be the same tier. Cupronickel gives one parallel, Kanthal four, and Eternity 67,108,864. The limit is floor(4^((heat−901)/900−1)), using real division. A mixed jacket will not form.\n\nEach parallel burns 1000 mB once per five-second batch. Actual parallel is the smallest of the configured limit, the coil limit and the whole buckets of fuel available. Better coils are a ceiling, not a command to conjure more fuel.", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "tower_hatches", "x": 576, "y": 336, "size": 24, "parents": ["tower_coils"], "kind": "info", "symbol": "I/O", "art": "", "short": {"zh_CN": "仓室位置", "en_US": "Hatches"}, "zh_CN": {"name": "前门进料，后门送电", "desc": "在主机同一面、模型 Y=2 或 3 的指定化学惰性机械方块位置，安装 1～3 个流体输入仓，并且恰好安装 1 个维护仓。最下面一排不是仓室位。\n\n背面两排指定的坚固钢机械方块允许安装最多 16 个动力仓。无线模式可以不装动力仓。在结构预览中右键允许替换的外壳，即可查看候选方块。除了燃料，两种底数流体仍然都要供应。", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "Front Door, Back Door", "desc": "Install one to three fluid input hatches and exactly one Maintenance Hatch in the permitted chemically inert casings on the controller face, at model Y=2 or 3. The lowest row is not a hatch row.\n\nThe two rear Solid Steel Machine Casing rows accept up to sixteen dynamo hatches. Wireless operation can use no dynamos. In the structure preview, right-click a permitted casing to see replacements. You still need to supply both base fluids as well as the fuel.", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "tower_operation", "x": 672, "y": 336, "size": 24, "parents": ["tower_hatches"], "kind": "info", "symbol": "5s", "art": "", "short": {"zh_CN": "燃料投喂", "en_US": "Operation"}, "zh_CN": {"name": "每五秒，吃一顿", "desc": "每批开始时，主机只检查读取到的第一种非底数流体。如果它不是有效燃料，机器不会继续搜索后面的罐子。燃料按 1000mB 的整数倍消耗，并受有效并行上限限制；每份同时需要科技和魔法底数流体各 1mB。\n\n两种底数流体都必须够支付整批。初始两个指数均为 1，此时燃料效率就是科技底数×魔法底数。能量在接下来的 100 tick 内均匀输出。燃料已经预付，运行中拆机不会退款。", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "Five Seconds at a Time", "desc": "At the start of a batch, the tower checks only the first non-base fluid it reads. An invalid first fuel prevents startup; it does not search later tanks for something tastier. It consumes whole 1000 mB units up to its effective parallel limit, plus 1 mB of each base fluid per unit.\n\nBoth base fluids must cover the entire planned batch. With the default exponents of 1, fuel efficiency is technology base × magic base. The energy is then spread evenly across 100 ticks. Fuel is prepaid, so dismantling the machine mid-batch does not return it.", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "tower_output", "x": 768, "y": 336, "size": 24, "parents": ["tower_operation"], "kind": "info", "symbol": "EU", "art": "", "short": {"zh_CN": "电力发送", "en_US": "Delivery"}, "zh_CN": {"name": "容量不是吞吐量", "desc": "有线模式按每个动力仓的电压×安培数，以及剩余缓存空间注入电能。主机显示的“实际发送”是这笔注入量，不是远处机器已经用掉的电。悬停主机信息即可检查实际缓存。没有连接设备的动力仓会逐渐充满，后续多余发电就浪费了。\n\n无线模式把能量发送到主机所有者的无线账户。模式修改从下一批生效。无论哪种模式，都不会为了等待存储空间而暂停燃料配方。", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "Do Not Confuse Storage with Throughput", "desc": "Wired mode inserts energy into dynamos within each hatch's voltage × amperage limit and free buffer space. The controller's delivered value measures this insertion, not energy already used by a distant machine. Hover over the statistics to inspect the real buffer. A disconnected hatch fills up, and the remaining generation is lost.\n\nWireless mode sends energy to the owner's wireless account. Mode changes take effect with the next batch. Neither mode pauses the fuel recipe to wait for somewhere to store excess power.", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "technology_route", "x": 288, "y": 456, "size": 24, "parents": ["tower"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/core_technology_mk1.png", "short": {"zh_CN": "科技路线", "en_US": "Technology"}, "zh_CN": {"name": "§b小底数，大指数", "desc": "科技侧用较小的底数，换取较高的永久指数。底数流体持续消耗，指数核心只需安装一次。两侧倍率相乘，不能拿一侧替代另一侧。\n\n主机初始指数为 1。把下一级核心放入右下角物品格，该侧就会永久升级。不能跳级，重复安装不会叠加，也不能拿电压之星代替指数核心。\n\n[note]这是说明支线。底数流体、指数核心、主机和导光外壳的生存合成配方尚未确定。阅读后勾选即可，不要求提交，也不会奖励待定材料；这条支线不阻挡燃料主线。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "§bSmall Base, Big Exponent", "desc": "The technology route trades modest base multipliers for a large permanent exponent. Base fluids are consumed; exponent cores are installed once. The two routes multiply together, and neither replaces the other.\n\nThe controller begins at exponent 1. Feed the next core tier into its lower-right slot to permanently raise that route. You cannot skip tiers, install a duplicate for another bonus, or use a Voltage Star in place of a core.\n\n[note]This is a reference branch. Survival recipes for base fluids, exponent cores, the controller and its light casing are not yet defined. Read and check the box; no pending material is requested or awarded, and this branch does not gate the fuel chain.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "technology_mk1", "x": 384, "y": 456, "size": 24, "parents": ["technology_route"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/core_technology_mk1.png", "short": {"zh_CN": "Mk1", "en_US": "Mk1"}, "zh_CN": {"name": "§b科技路线 Mk1", "desc": "Mk1 科技底数流体提供 1.01 的底数，Mk1 核心将该侧指数升级至 2。这组搭配单独提供约 1.0201 倍，之后再乘上另一侧的倍率。科技底数流体计划在 LuV 阶段解锁。\n\n无论 Mk 等级如何，每 1000mB 燃料都只消耗该侧底数 1mB。先装完前面的核心等级，再安装这一级；更换底数流体并不等于安装了核心。\n\n[note]本节点仅供阅读：暂无生存配方，不要求提交，也不发放材料奖励。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "§bTechnology Mk1", "desc": "Mk1 technology base fluid supplies a base of 1.01; the Mk1 core raises this route's exponent to 2. Together they contribute about 1.0201×, before the other route is multiplied in. The technology fluid is planned for LuV progression.\n\nThe consumption remains 1 mB per 1000 mB of fuel, regardless of Mk. Bring this core only after installing the previous tiers; swapping base fluids does not install a core.\n\n[note]Reference only: no survival recipe, item submission or material reward is defined for this node.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "technology_mk2", "x": 480, "y": 456, "size": 24, "parents": ["technology_mk1"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/core_technology_mk2.png", "short": {"zh_CN": "Mk2", "en_US": "Mk2"}, "zh_CN": {"name": "§b科技路线 Mk2", "desc": "Mk2 科技底数流体提供 1.02 的底数，Mk2 核心将该侧指数升级至 4。这组搭配单独提供约 1.0824 倍，之后再乘上另一侧的倍率。科技底数流体计划在 UV 阶段解锁。\n\n无论 Mk 等级如何，每 1000mB 燃料都只消耗该侧底数 1mB。先装完前面的核心等级，再安装这一级；更换底数流体并不等于安装了核心。\n\n[note]本节点仅供阅读：暂无生存配方，不要求提交，也不发放材料奖励。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "§bTechnology Mk2", "desc": "Mk2 technology base fluid supplies a base of 1.02; the Mk2 core raises this route's exponent to 4. Together they contribute about 1.0824×, before the other route is multiplied in. The technology fluid is planned for UV progression.\n\nThe consumption remains 1 mB per 1000 mB of fuel, regardless of Mk. Bring this core only after installing the previous tiers; swapping base fluids does not install a core.\n\n[note]Reference only: no survival recipe, item submission or material reward is defined for this node.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "technology_mk3", "x": 576, "y": 456, "size": 24, "parents": ["technology_mk2"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/core_technology_mk3.png", "short": {"zh_CN": "Mk3", "en_US": "Mk3"}, "zh_CN": {"name": "§b科技路线 Mk3", "desc": "Mk3 科技底数流体提供 1.05 的底数，Mk3 核心将该侧指数升级至 8。这组搭配单独提供约 1.4775 倍，之后再乘上另一侧的倍率。科技底数流体计划在 UEV 阶段解锁。\n\n无论 Mk 等级如何，每 1000mB 燃料都只消耗该侧底数 1mB。先装完前面的核心等级，再安装这一级；更换底数流体并不等于安装了核心。\n\n[note]本节点仅供阅读：暂无生存配方，不要求提交，也不发放材料奖励。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "§bTechnology Mk3", "desc": "Mk3 technology base fluid supplies a base of 1.05; the Mk3 core raises this route's exponent to 8. Together they contribute about 1.4775×, before the other route is multiplied in. The technology fluid is planned for UEV progression.\n\nThe consumption remains 1 mB per 1000 mB of fuel, regardless of Mk. Bring this core only after installing the previous tiers; swapping base fluids does not install a core.\n\n[note]Reference only: no survival recipe, item submission or material reward is defined for this node.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "technology_mk4", "x": 672, "y": 456, "size": 24, "parents": ["technology_mk3"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/core_technology_mk4.png", "short": {"zh_CN": "Mk4", "en_US": "Mk4"}, "zh_CN": {"name": "§b科技路线 Mk4", "desc": "Mk4 科技底数流体提供 1.07 的底数，Mk4 核心将该侧指数升级至 16。这组搭配单独提供约 2.9522 倍，之后再乘上另一侧的倍率。科技底数流体计划在 UMV 阶段解锁。\n\n无论 Mk 等级如何，每 1000mB 燃料都只消耗该侧底数 1mB。先装完前面的核心等级，再安装这一级；更换底数流体并不等于安装了核心。\n\n[note]本节点仅供阅读：暂无生存配方，不要求提交，也不发放材料奖励。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "§bTechnology Mk4", "desc": "Mk4 technology base fluid supplies a base of 1.07; the Mk4 core raises this route's exponent to 16. Together they contribute about 2.9522×, before the other route is multiplied in. The technology fluid is planned for UMV progression.\n\nThe consumption remains 1 mB per 1000 mB of fuel, regardless of Mk. Bring this core only after installing the previous tiers; swapping base fluids does not install a core.\n\n[note]Reference only: no survival recipe, item submission or material reward is defined for this node.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "technology_mk5", "x": 768, "y": 456, "size": 24, "parents": ["technology_mk4"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/core_technology_mk5.png", "short": {"zh_CN": "Mk5", "en_US": "Mk5"}, "zh_CN": {"name": "§b科技路线 Mk5", "desc": "Mk5 科技底数流体提供 1.1 的底数，Mk5 核心将该侧指数升级至 32。这组搭配单独提供约 21.1138 倍，之后再乘上另一侧的倍率。科技底数流体计划在 UXV 阶段解锁。\n\n无论 Mk 等级如何，每 1000mB 燃料都只消耗该侧底数 1mB。先装完前面的核心等级，再安装这一级；更换底数流体并不等于安装了核心。\n\n[note]本节点仅供阅读：暂无生存配方，不要求提交，也不发放材料奖励。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "§bTechnology Mk5", "desc": "Mk5 technology base fluid supplies a base of 1.1; the Mk5 core raises this route's exponent to 32. Together they contribute about 21.1138×, before the other route is multiplied in. The technology fluid is planned for UXV progression.\n\nThe consumption remains 1 mB per 1000 mB of fuel, regardless of Mk. Bring this core only after installing the previous tiers; swapping base fluids does not install a core.\n\n[note]Reference only: no survival recipe, item submission or material reward is defined for this node.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "magic_route", "x": 288, "y": 552, "size": 24, "parents": ["tower"], "kind": "magic", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/core_magic_mk1.png", "short": {"zh_CN": "魔法路线", "en_US": "Magic"}, "zh_CN": {"name": "§d大底数，小指数", "desc": "魔法侧的底数更大，但永久指数相对较低。底数流体持续消耗，指数核心只需安装一次。两侧倍率相乘，不能拿一侧替代另一侧。\n\n主机初始指数为 1。把下一级核心放入右下角物品格，该侧就会永久升级。不能跳级，重复安装不会叠加，也不能拿电压之星代替指数核心。\n\n[note]这是说明支线。底数流体、指数核心、主机和导光外壳的生存合成配方尚未确定。阅读后勾选即可，不要求提交，也不会奖励待定材料；这条支线不阻挡燃料主线。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "§dA Little More Magic", "desc": "The magic route offers larger base multipliers with a smaller permanent exponent. Base fluids are consumed; exponent cores are installed once. The two routes multiply together, and neither replaces the other.\n\nThe controller begins at exponent 1. Feed the next core tier into its lower-right slot to permanently raise that route. You cannot skip tiers, install a duplicate for another bonus, or use a Voltage Star in place of a core.\n\n[note]This is a reference branch. Survival recipes for base fluids, exponent cores, the controller and its light casing are not yet defined. Read and check the box; no pending material is requested or awarded, and this branch does not gate the fuel chain.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "magic_mk1", "x": 384, "y": 552, "size": 24, "parents": ["magic_route"], "kind": "magic", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/core_magic_mk1.png", "short": {"zh_CN": "Mk1", "en_US": "Mk1"}, "zh_CN": {"name": "§d魔法路线 Mk1", "desc": "Mk1 魔法底数流体提供 1.01 的底数，Mk1 核心将该侧指数升级至 2。这组搭配单独提供约 1.0201 倍，之后再乘上另一侧的倍率。魔法流体的具体配方与独立解锁阶段尚未确定。\n\n无论 Mk 等级如何，每 1000mB 燃料都只消耗该侧底数 1mB。先装完前面的核心等级，再安装这一级；更换底数流体并不等于安装了核心。\n\n[note]本节点仅供阅读：暂无生存配方，不要求提交，也不发放材料奖励。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "§dMagic Mk1", "desc": "Mk1 magic base fluid supplies a base of 1.01; the Mk1 core raises this route's exponent to 2. Together they contribute about 1.0201×, before the other route is multiplied in. The magic fluid progression has no final recipe or independent unlock stage yet.\n\nThe consumption remains 1 mB per 1000 mB of fuel, regardless of Mk. Bring this core only after installing the previous tiers; swapping base fluids does not install a core.\n\n[note]Reference only: no survival recipe, item submission or material reward is defined for this node.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "magic_mk2", "x": 480, "y": 552, "size": 24, "parents": ["magic_mk1"], "kind": "magic", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/i he previous tiers; swapping base fluids does not install a core.\n\n[note]Reference only: no survival recipe, item submission or material reward is defined for this node.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "magic_mk4", "x": 672, "y": 552, "size": 24, "parents": ["magic_mk3"], "kind": "magic", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/core_magic_mk4.png", "short": {"zh_CN": "Mk4", "en_US": "Mk4"}, "zh_CN": {"name": "§d魔法路线 Mk4", "desc": "Mk4 魔法底数流体提供 1.2 的底数，Mk4 核心将该侧指数升级至 8。这组搭配单独提供约 4.2998 倍，之后再乘上另一侧的倍率。魔法流体的具体配方与独立解锁阶段尚未确定。\n\n无论 Mk 等级如何，每 1000mB 燃料都只消耗该侧底数 1mB。先装完前面的核心等级，再安装这一级；更换底数流体并不等于安装了核心。\n\n[note]本节点仅供阅读：暂无生存配方，不要求提交，也不发放材料奖励。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "§dMagic Mk4", "desc": "Mk4 magic base fluid supplies a base of 1.2; the Mk4 core raises this route's exponent to 8. Together they contribute about 4.2998×, before the other route is multiplied in. The magic fluid progression has no final recipe or independent unlock stage yet.\n\nThe consumption remains 1 mB per 1000 mB of fuel, regardless of Mk. Bring this core only after installing the previous tiers; swapping base fluids does not install a core.\n\n[note]Reference only: no survival recipe, item submission or material reward is defined for this node.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "magic_mk5", "x": 768, "y": 552, "size": 24, "parents": ["magic_mk4"], "kind": "magic", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/core_magic_mk5.png", "short": {"zh_CN": "Mk5", "en_US": "Mk5"}, "zh_CN": {"name": "§d魔法路线 Mk5", "desc": "Mk5 魔法底数流体提供 1.3 的底数，Mk5 核心将该侧指数升级至 10。这组搭配单独提供约 13.7858 倍，之后再乘上另一侧的倍率。魔法流体的具体配方与独立解锁阶段尚未确定。\n\n无论 Mk 等级如何，每 1000mB 燃料都只消耗该侧底数 1mB。先装完前面的核心等级，再安装这一级；更换底数流体并不等于安装了核心。\n\n[note]本节点仅供阅读：暂无生存配方，不要求提交，也不发放材料奖励。[/note]", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "§dMagic Mk5", "desc": "Mk5 magic base fluid supplies a base of 1.3; the Mk5 core raises this route's exponent to 10. Together they contribute about 13.7858×, before the other route is multiplied in. The magic fluid progression has no final recipe or independent unlock stage yet.\n\nThe consumption remains 1 mB per 1000 mB of fuel, regardless of Mk. Bring this core only after installing the previous tiers; swapping base fluids does not install a core.\n\n[note]Reference only: no survival recipe, item submission or material reward is defined for this node.[/note]", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "stars", "x": 0, "y": 696, "size": 24, "parents": ["welcome"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/star_lv.png", "short": {"zh_CN": "电压之星", "en_US": "Voltage stars"}, "zh_CN": {"name": "组装机里，也有星星", "desc": "电压之星打包了同电压等级的八类基础部件：马达、活塞、泵、传送带、机械臂、发射器、传感器和力场发生器。起点是在 LV 组装机中，以 LV 电压把各一个 LV 部件加工 8 秒。\n\n这是一条独立的收集与制造支线。目前星星不是燃料、底数流体或指数核心的配方材料，尤其不能拿来直接升级发电机。下方任务只检测一个星星，不会收走它，可以继续投入下一级配方。", "task": "阅读后勾选；无强制材料提交。", "reward": "无物资奖励。"}, "en_US": {"name": "Stars Made in an Assembler", "desc": "Voltage Stars package the eight basic component families of a voltage tier: Motor, Piston, Pump, Conveyor Module, Robot Arm, Emitter, Sensor and Field Generator. Start with one of each LV component in an LV Assembler for 8 seconds.\n\nThis is a separate collection and manufacturing branch. Stars are not currently ingredients of fuel, base-fluid or exponent-core recipes. In particular, a star does not upgrade the generator. The tasks below detect one star without consuming it, so it can go straight into the next recipe.", "task": "Read and check the box; no required materials.", "reward": "No material reward."}}, {"key": "star_0", "x": 96, "y": 696, "size": 24, "parents": ["stars"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/star_lv.png", "short": {"zh_CN": "LV", "en_US": "LV"}, "zh_CN": {"name": "LV之星", "desc": "将八类 LV 基础部件各 1 个送入组装机，以 LV 电压加工 8 秒，得到一个 LV 之星。\n\n任务只检测星星，不会收走它、额外赠送星星，或解锁尚未确定的发电机升级配方。", "task": "检测指定物品，不消耗。", "reward": "一次性奖励：1 × 技术员硬币 I"}, "en_US": {"name": "LV Star", "desc": "Use 1 of each of the eight LV components in the Assembler. The recipe uses LV voltage for 8 seconds and makes one LV Star.\n\nThe task only detects the star. It does not consume it, grant another star or unlock a pending generator upgrade.", "task": "Detect the specified item without consuming it.", "reward": "One-time reward: 1 × TechnicianI coin"}}, {"key": "star_1", "x": 168, "y": 696, "size": 24, "parents": ["star_0"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/star_mv.png", "short": {"zh_CN": "MV", "en_US": "MV"}, "zh_CN": {"name": "MV之星", "desc": "将八类 MV 基础部件各 2 个，以及 16 个上一级电压之星送入组装机，以 MV 电压加工 16 秒，得到一个 MV 之星。\n\n任务只检测星星，不会收走它、额外赠送星星，或解锁尚未确定的发电机升级配方。", "task": "检测指定物品，不消耗。", "reward": "一次性奖励：1 × 技术员硬币 I"}, "en_US": {"name": "MV Star", "desc": "Use 2 of each of the eight MV components and 16 stars of the previous voltage tier in the Assembler. The recipe uses MV voltage for 16 seconds and makes one MV Star.\n\nThe task only detects the star. It does not consume it, grant another star or unlock a pending generator upgrade.", "task": "Detect the specified item without consuming it.", "reward": "One-time reward: 1 × TechnicianI coin"}}, {"key": "star_2", "x": 240, "y": 696, "size": 24, "parents": ["star_1"], "kind": "info", "symbol": "•", "art": "../src/main/resources/assets/benzenefuels/textures/items/star_hv.png", "short": {"zh_CN": "HV", "en_US": "HV"}, "zh_CN": {"name": "HV之星", "desc": "将八类 HV 基础部件各 4 个，以及 16 个上一级电压之星送入组装机，以 HV 电压加工 32 秒，得到一个 HV 之星。\n\n任务只检测星星，不会收走它、额外赠送星星，或解锁尚未确定的发电机升级配方。", "task": "检测指定物品，不消耗。", "reward": "一次性奖励：1 × 技术员硬币 II"}, "en_US": {"name": "HV Star", "de <script>
const rows=JSON.parse(document.getElementById('data').textContent), byKey=new Map(rows.map(r=>[r.key,r]));
let language='zh_CN', selected='fuel_luv';
const map=document.getElementById('map'), svg=document.getElementById('edges');
const positions=new Map(rows.map(r=>[r.key,{x:r.x+52+r.size/2,y:r.y+68+r.size/2}]));
const lanes=[{y:8,zh:'原版设备前置',en:'Native machine milestones'},{y:352,zh:'UV 发电塔 · 工程说明',en:'UV generator · Engineering reference'}, {y:488,zh:'科技侧 · 说明支线',en:'Technology · Reference'}, {y:584,zh:'魔法侧 · 说明支线',en:'Magic · Reference'}, {y:712,zh:'电压之星 · 独立制造支线',en:'Voltage stars · Manufacturing'}];
function plain(value){return value.replace(/§./g,'')}
function render(){
 map.querySelectorAll('button,.lane').forEach(n=>n.remove());svg.replaceChildren();
 lanes.forEach(l=>{let e=document.createElement('div');e.className='lane';e.style.top=l.y+'px';e.textContent=language==='zh_CN'?l.zh:l.en;map.append(e)});
 rows.forEach(r=>r.parents.forEach(p=>{const a=positions.get(p), b=positions.get(r.key);if(!a)return;let edge=document.createElementNS('http://www.w3.org/2000/svg','path');edge.setAttribute('d',`M${a.x} ${a.y} L${b.x} ${b.y}`);edge.setAttribute('class','edge'+(r.key===selected?' active':''));svg.append(edge)}));
 rows.forEach(r=>{let button=document.createElement('button');button.type='button';button.className='node '+r.kind+(r.key===selected?' selected':'');button.style.cssText=`left:${r.x+52}px;top:${r.y+68}px;width:${r.size}px;height:${r.size}px`;button.setAttribute('aria-label',plain(r[language].name));button.setAttribute('aria-pressed',r.key===selected);button.dataset.key=r.key;
 if(r.art){let image=document.createElement('span');image.className='art';image.style.backgroundImage=`url("${r.art}")`;button.append(image)}else{let code=document.createElement('span');code.className='code';code.textContent=r.symbol;button.append(code)}
 let label=document.createElement('span');label.className='label';label.textContent=r.short[language];button.append(label);button.addEventListener('click',()=>{selected=r.key;render()});map.append(button)});
 const q=byKey.get(selected), t=q[language];document.getElementById('name').textContent=plain(t.name);
 const description=document.getElementById('description');description.replaceChildren();
 plain(t.desc).split(/(\[(?:note|warn)\][\s\S]*?\[\/(?:note|warn)\])/g).forEach(part=>{let span=document.createElement('span');span.className=part.startsWith('[note]')?'note':part.startsWith('[warn]')?'warn':'';span.textContent=part.replace(/\[\/?(?:note|warn)\]/g,'');description.append(span)});
 document.getElementById('details').textContent=(language==='zh_CN'?'前置：':'Prerequisites: ')+(q.parents.map(p=>plain(byKey.get(p)[language].name)).join(' · ')||(language==='zh_CN'?'无':'None'))+'\n'+t.task+'\n'+t.reward;
 document.getElementById('details').style.whiteSpace='pre-line';
 document.getElementById('title').textContent=language==='zh_CN'?'苯向星辰':'Benzene Beyond the Horizon';document.getElementById('language').textContent=language==='zh_CN'?'English':'简体中文';document.getElementById('subtitle').textContent=language==='zh_CN'?'GTNH 2.9.0 · 46 个新任务 + 7 个原版前置 · 按实际任务坐标生成':'GTNH 2.9.0 · 46 new quests + 7 native prerequisites · Actual chapter coordinates';
}
document.getElementById('language').addEventListener('click',()=>{language=language==='zh_CN'?'en_US':'zh_CN';render()});render();
</script>
